<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PANDU — Pilot Safety Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-900:#0a1c2b;
    --ink-800:#12293d;
    --ink-700:#1a3650;
    --line: rgba(244,241,234,0.10);
    --text: #f4f1ea;
    --text-muted: rgba(244,241,234,0.58);
    --chart-paper:#e7dfc6;
    --chart-land:#c7bb96;
    --chart-line:#8a7a55;
    --chart-line-soft: rgba(138,122,85,0.45);
    --safe:#1fa37a;
    --safe-dim: rgba(31,163,122,0.16);
    --caution:#e0a83e;
    --caution-dim: rgba(224,168,62,0.16);
    --alert:#e8542b;
    --alert-dim: rgba(232,84,43,0.18);
    color-scheme: dark;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background: var(--ink-900);
    color: var(--text);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .app-shell{
    max-width: 460px;
    margin: 0 auto;
    min-height: 100vh;
    padding: 14px 16px calc(96px + env(safe-area-inset-bottom, 0px));
    position: relative;
  }

  /* Top bar */
  .topbar{ display:flex; align-items:center; justify-content:space-between; padding: 4px 2px 14px; }
  .wordmark{ font-family:'Bebas Neue', sans-serif; font-size: 26px; letter-spacing: 3px; color: var(--text); }
  .wordmark span{ color: var(--safe); }
  .clock{ font-family:'IBM Plex Mono', monospace; font-size: 13px; color: var(--text-muted); font-variant-numeric: tabular-nums; display:flex; align-items:center; gap:7px; }
  .dot{ width:7px; height:7px; border-radius:50%; background: var(--safe); box-shadow: 0 0 0 3px var(--safe-dim); }

  /* Demo switcher — mockup-only affordance, visually flagged as such */
  .demo-switcher{ display:flex; gap:6px; margin-bottom:16px; padding:8px; border:1px dashed var(--line); border-radius:10px; }
  .demo-label{ font-family:'IBM Plex Mono', monospace; font-size:9px; letter-spacing:1px; text-transform:uppercase; color: var(--text-muted); align-self:center; padding-right:2px; }
  .demo-btn{ flex:1; font-family:'IBM Plex Mono', monospace; font-size:10px; letter-spacing:.5px; text-transform:uppercase; padding:7px 4px; border-radius:7px; border:1px solid var(--line); background:transparent; color: var(--text-muted); cursor:pointer; }
  .demo-btn.active{ background: var(--ink-700); color: var(--text); border-color: var(--line); }

  /* Hero status band */
  .hero{ border-radius:16px; padding:18px 18px 16px; margin-bottom:14px; transition: background .25s ease; }
  .hero[data-state="safe"]{ background: linear-gradient(155deg, var(--safe-dim), var(--ink-800) 70%); border:1px solid rgba(31,163,122,0.35); }
  .hero[data-state="offline"]{ background: linear-gradient(155deg, var(--caution-dim), var(--ink-800) 70%); border:1px solid rgba(224,168,62,0.35); }
  .hero[data-state="sos"]{ background: linear-gradient(155deg, var(--alert-dim), var(--ink-800) 70%); border:1px solid rgba(232,84,43,0.45); }
  .hero-top{ display:flex; align-items:baseline; justify-content:space-between; }
  .hero-label{ font-family:'Bebas Neue', sans-serif; font-size: 40px; letter-spacing: 1.5px; line-height:1; }
  [data-state="safe"] .hero-label{ color: var(--safe); }
  [data-state="offline"] .hero-label{ color: var(--caution); }
  [data-state="sos"] .hero-label{ color: var(--alert); }
  .hero-since{ font-family:'IBM Plex Mono', monospace; font-size:12px; color: var(--text-muted); text-align:right; }
  .hero-sub{ margin-top:8px; font-size:14px; color: var(--text-muted); }
  .hero-sub b{ color: var(--text); font-weight:600; }

  /* Chart card */
  .chart-card{ background: var(--chart-paper); border-radius:16px; overflow:hidden; margin-bottom:14px; position:relative; border:1px solid rgba(0,0,0,0.15); }
  .chart-card svg{ display:block; width:100%; height:auto; }
  .chart-readout{ display:flex; justify-content:space-between; padding:9px 12px; background: rgba(10,28,43,0.06); font-family:'IBM Plex Mono', monospace; font-size:11px; color:#3a331f; }

  /* Telemetry grid */
  .telemetry{ display:grid; grid-template-columns: 1fr 1fr; gap:10px; margin-bottom:14px; }
  .tile{ background: var(--ink-800); border:1px solid var(--line); border-radius:14px; padding:12px 13px; }
  .tile-label{ font-size:11px; color: var(--text-muted); text-transform:uppercase; letter-spacing:.6px; margin-bottom:6px; }
  .tile-value{ font-family:'IBM Plex Mono', monospace; font-size:19px; font-variant-numeric: tabular-nums; margin-bottom:8px; }
  .bar-track{ height:5px; border-radius:3px; background: rgba(244,241,234,0.10); overflow:hidden; }
  .bar-fill{ height:100%; border-radius:3px; transition: width .3s ease, background .3s ease; }
  .bars-signal{ display:flex; align-items:flex-end; gap:3px; height:16px; }
  .bars-signal i{ width:5px; border-radius:1px; background: rgba(244,241,234,0.16); display:block; }
  .bars-signal i.on{ background: var(--text); }

  /* Log teaser */
  .log-teaser{ display:flex; align-items:center; justify-content:space-between; padding:12px 14px; background: var(--ink-800); border:1px solid var(--line); border-radius:14px; margin-bottom:8px; font-size:13px; }
  .log-teaser .dot-sm{ width:6px; height:6px; border-radius:50%; margin-right:9px; flex-shrink:0; }
  .log-teaser-text{ display:flex; align-items:center; color: var(--text-muted); overflow:hidden; }
  .log-teaser-text b{ color: var(--text); font-weight:500; margin-left:4px; }
  .log-teaser-chev{ color: var(--text-muted); font-family:'IBM Plex Mono', monospace; }

  /* Bottom action bar */
  .action-bar{ position:fixed; left:0; right:0; bottom:0; display:flex; justify-content:center; padding: 10px 16px calc(14px + env(safe-area-inset-bottom, 0px)); background: linear-gradient(0deg, var(--ink-900) 60%, rgba(10,28,43,0)); }
  .action-inner{ max-width:460px; width:100%; display:flex; gap:10px; }
  .btn{ flex:1; border:none; border-radius:14px; font-family:'IBM Plex Sans', sans-serif; font-weight:600; font-size:14px; padding:15px 10px; cursor:pointer; }
  .btn-safe{ background: var(--ink-700); color: var(--text); border:1px solid var(--line); }
  .btn-sos{ position:relative; overflow:hidden; background: var(--alert); color:#fff; letter-spacing:.3px; }
  .btn-sos .fill{ position:absolute; inset:0; background: rgba(255,255,255,0.32); width:0%; }
  .btn-sos span{ position:relative; }

  @media (prefers-reduced-motion: no-preference){
    .pulse-ring{ animation: pulse 2.2s ease-out infinite; }
    [data-state="sos"] .pulse-ring{ animation-duration: 1s; }
  }
  @keyframes pulse{
    0%{ r:6; opacity:.55; }
    80%{ r:26; opacity:0; }
    100%{ r:26; opacity:0; }
  }
</style>
</head>
<body>
<div class="app-shell">

  <div class="topbar">
    <div class="wordmark">PAN<span>DU</span></div>
    <div class="clock"><span class="dot" id="connDot"></span><span id="clock">00:00:00</span></div>
  </div>

  <div class="demo-switcher">
    <span class="demo-label">Mockup state</span>
    <button class="demo-btn active" data-set="safe">Safe</button>
    <button class="demo-btn" data-set="offline">Offline</button>
    <button class="demo-btn" data-set="sos">SOS</button>
  </div>

  <div class="hero" id="hero" data-state="safe">
    <div class="hero-top">
      <div class="hero-label" id="heroLabel">ON STATION</div>
      <div class="hero-since" id="heroSince">updated 2s ago</div>
    </div>
    <div class="hero-sub" id="heroSub"><b>Capt. A. Ridwan</b> · boarding MV Nusantara Bahari</div>
  </div>

  <div class="chart-card">
    <svg viewBox="0 0 300 210" role="img" aria-label="Live chart plot of pilot position near port approach">
      <rect width="300" height="210" fill="var(--chart-paper)"/>
      <!-- graticule ticks -->
      <g stroke="var(--chart-line-soft)" stroke-width="1">
        <line x1="0" y1="0" x2="0" y2="210"/>
        <line x1="60" y1="0" x2="60" y2="6"/><line x1="120" y1="0" x2="120" y2="6"/><line x1="180" y1="0" x2="180" y2="6"/><line x1="240" y1="0" x2="240" y2="6"/>
        <line x1="0" y1="52" x2="6" y2="52"/><line x1="0" y1="104" x2="6" y2="104"/><line x1="0" y1="156" x2="6" y2="156"/>
      </g>
      <!-- land mass, top-left -->
      <path d="M0,0 L0,58 Q42,46 68,30 Q96,14 130,18 L120,0 Z" fill="var(--chart-land)"/>
      <g stroke="var(--chart-line)" stroke-width="1" opacity="0.5">
        <line x1="8" y1="10" x2="2" y2="16"/><line x1="20" y1="14" x2="12" y2="22"/><line x1="34" y1="16" x2="26" y2="25"/>
        <line x1="50" y1="20" x2="42" y2="30"/><line x1="66" y1="18" x2="60" y2="28"/><line x1="82" y1="14" x2="78" y2="24"/>
      </g>
      <text x="34" y="34" font-family="IBM Plex Mono" font-size="7" fill="var(--chart-line)">TG. PRIOK</text>
      <!-- depth contours -->
      <path d="M-10,90 Q80,70 160,95 T330,80" fill="none" stroke="var(--chart-line)" stroke-width="1" stroke-dasharray="4 3" opacity="0.55"/>
      <path d="M-10,130 Q90,110 170,135 T330,120" fill="none" stroke="var(--chart-line)" stroke-width="1" stroke-dasharray="4 3" opacity="0.4"/>
      <path d="M-10,170 Q100,155 180,175 T330,160" fill="none" stroke="var(--chart-line)" stroke-width="1" stroke-dasharray="4 3" opacity="0.3"/>
      <!-- depth soundings -->
      <g font-family="IBM Plex Mono" font-size="7" fill="var(--chart-line)">
        <text x="70" y="86">18</text><text x="150" y="100">14</text><text x="230" y="90">21</text>
        <text x="100" y="128">9</text><text x="200" y="140">12</text><text x="60" y="165">6</text>
      </g>
      <!-- recent track -->
      <path d="M110,58 Q140,80 158,105 Q168,118 176,128" fill="none" stroke="#3a331f" stroke-width="1.4" stroke-dasharray="1 4" stroke-linecap="round" opacity="0.6"/>
      <!-- position marker -->
      <g id="posMarker" transform="translate(176,128)">
        <circle class="pulse-ring" r="6" fill="none" stroke="var(--safe)" stroke-width="2"/>
        <circle r="5" fill="var(--safe)" stroke="#0a1c2b" stroke-width="1.5"/>
      </g>
      <!-- compass rose -->
      <g transform="translate(258,168)" opacity="0.75">
        <circle r="26" fill="none" stroke="var(--chart-line)" stroke-width="1"/>
        <path d="M0,-24 L4,0 L0,24 L-4,0 Z" fill="var(--chart-line)"/>
        <path d="M-24,0 L0,4 L24,0 L0,-4 Z" fill="var(--chart-line-soft)"/>
        <text x="0" y="-30" text-anchor="middle" font-family="IBM Plex Mono" font-size="8" fill="var(--chart-line)">N</text>
      </g>
    </svg>
    <div class="chart-readout">
      <span id="coords">6°06.2'S 106°52.9'E</span>
      <span id="heading">HDG 214° · 0.4kt</span>
    </div>
  </div>

  <div class="telemetry">
    <div class="tile">
      <div class="tile-label">Vest battery</div>
      <div class="tile-value" id="vestBatt">82%</div>
      <div class="bar-track"><div class="bar-fill" id="vestBattBar" style="width:82%; background:var(--safe);"></div></div>
    </div>
    <div class="tile">
      <div class="tile-label">Helmet battery</div>
      <div class="tile-value" id="helmBatt">64%</div>
      <div class="bar-track"><div class="bar-fill" id="helmBattBar" style="width:64%; background:var(--safe);"></div></div>
    </div>
    <div class="tile">
      <div class="tile-label">LoRa signal</div>
      <div class="tile-value" id="loraVal">−78 dBm</div>
      <div class="bars-signal" id="loraBars">
        <i class="on" style="height:30%"></i><i class="on" style="height:50%"></i><i class="on" style="height:70%"></i><i style="height:85%"></i><i style="height:100%"></i>
      </div>
    </div>
    <div class="tile">
      <div class="tile-label">GPS fix</div>
      <div class="tile-value" id="gpsVal">3D · 7 sat</div>
      <div class="tile-label" id="gpsAge" style="margin-top:-2px; margin-bottom:0;">accurate to 3m</div>
    </div>
  </div>

  <div class="log-teaser">
    <div class="log-teaser-text"><span class="dot-sm" id="logDot" style="background:var(--safe);"></span>Last event:<b id="logText">Boarding started</b></div>
    <div class="log-teaser-chev">Log ›</div>
  </div>

</div>

<div class="action-bar">
  <div class="action-inner">
    <button class="btn btn-safe" id="btnSafe">I'm safe</button>
    <button class="btn btn-sos" id="btnSos"><div class="fill" id="sosFill"></div><span id="sosLabel">Hold to send SOS</span></button>
  </div>
</div>

<script>
  const STATES = {
    safe: {
      dot: 'var(--safe)', heroLabel: 'ON STATION', sub: "<b>Capt. A. Ridwan</b> · boarding MV Nusantara Bahari",
      lora: '−78 dBm', loraOn: 3, gps: '3D · 7 sat', gpsAge: 'accurate to 3m',
      logDot: 'var(--safe)', logText: 'Boarding started', markerColor: 'var(--safe)'
    },
    offline: {
      dot: 'var(--caution)', heroLabel: 'SIGNAL LOST', sub: "<b>Capt. A. Ridwan</b> · last seen near MV Nusantara Bahari",
      lora: 'no link', loraOn: 0, gps: 'stale · 4m old', gpsAge: 'position may be outdated',
      logDot: 'var(--caution)', logText: 'LoRa link dropped', markerColor: 'var(--caution)'
    },
    sos: {
      dot: 'var(--alert)', heroLabel: 'SOS SENT', sub: "<b>Capt. A. Ridwan</b> · fall detected near pilot ladder",
      lora: '−82 dBm', loraOn: 2, gps: '3D · 6 sat', gpsAge: 'accurate to 5m',
      logDot: 'var(--alert)', logText: 'Fall detected — SOS sent', markerColor: 'var(--alert)'
    }
  };

  const hero = document.getElementById('hero');
  let sinceSeconds = 2;
  let currentState = 'safe';

  function applyState(name){
    currentState = name;
    const s = STATES[name];
    hero.dataset.state = name;
    document.getElementById('heroLabel').textContent = s.heroLabel;
    document.getElementById('heroSub').innerHTML = s.sub;
    document.getElementById('connDot').style.background = s.dot;
    document.getElementById('connDot').style.boxShadow = '0 0 0 3px ' + s.dot.replace(')', ', 0.2)').replace('var(--safe', 'rgba(31,163,122').replace('var(--caution', 'rgba(224,168,62').replace('var(--alert', 'rgba(232,84,43');
    document.getElementById('loraVal').textContent = s.lora;
    document.getElementById('gpsVal').textContent = s.gps;
    document.getElementById('gpsAge').textContent = s.gpsAge;
    document.getElementById('logDot').style.background = s.logDot;
    document.getElementById('logText').textContent = s.logText;
    document.querySelectorAll('#loraBars i').forEach((bar, i) => bar.classList.toggle('on', i < s.loraOn));
    document.getElementById('posMarker').querySelectorAll('circle').forEach(c => {
      if (c.classList.contains('pulse-ring')) c.setAttribute('stroke', s.markerColor);
      else c.setAttribute('fill', s.markerColor);
    });
    sinceSeconds = name === 'offline' ? 240 : 2;
    document.querySelectorAll('.demo-btn').forEach(b => b.classList.toggle('active', b.dataset.set === name));
  }

  document.querySelectorAll('.demo-btn').forEach(b => b.addEventListener('click', () => applyState(b.dataset.set)));

  function tick(){
    document.getElementById('clock').textContent = new Date().toLocaleTimeString('en-GB');
    if (currentState !== 'offline') sinceSeconds++;
    const label = sinceSeconds < 60 ? `updated ${sinceSeconds}s ago` : `updated ${Math.floor(sinceSeconds/60)}m ago`;
    document.getElementById('heroSince').textContent = currentState === 'offline' ? `last seen ${Math.floor(sinceSeconds/60)}m ago` : label;
  }
  setInterval(tick, 1000);
  tick();

  document.getElementById('btnSafe').addEventListener('click', () => applyState('safe'));

  const sosBtn = document.getElementById('btnSos');
  const sosFill = document.getElementById('sosFill');
  const sosLabel = document.getElementById('sosLabel');
  let holding = false;

  function startHold(){
    if (currentState === 'sos') return;
    holding = true;
    sosFill.style.transition = 'width 1.1s linear';
    sosFill.style.width = '100%';
    sosLabel.textContent = 'Keep holding…';
  }
  function endHold(){
    if (!holding) return;
    holding = false;
    if (sosFill.style.width !== '100%') {
      sosFill.style.transition = 'width .2s ease';
      sosFill.style.width = '0%';
      sosLabel.textContent = 'Hold to send SOS';
    }
  }
  sosFill.addEventListener('transitionend', () => {
    if (holding && sosFill.style.width === '100%') {
      applyState('sos');
      sosLabel.textContent = 'SOS sent';
      setTimeout(() => { sosFill.style.transition='width .2s ease'; sosFill.style.width='0%'; sosLabel.textContent='Hold to send SOS'; }, 1400);
    }
  });
  sosBtn.addEventListener('pointerdown', startHold);
  sosBtn.addEventListener('pointerup', endHold);
  sosBtn.addEventListener('pointerleave', endHold);
</script>
</body>
</html>
